[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openloops"
version = "0.1.7"
description = "Track the open loops between you and your coding agents: what they left open, what they need from you, and what is no longer blocked"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    "claude-code",
    "agents",
    "sessions",
    "transcripts",
    "digest",
    "handoff",
    "retention",
]
authors = [{ name = "Thor Whalen" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
# `dol` supplies the key-value store facade that makes the digest destination a
# one-argument swap -- a local directory today, a git-synced one or blob storage
# later, all the same interface -- and `cw` builds the CLI from the same functions
# the library exposes (MIT, and its own runtime dependency count is zero). Two of dol's file-store defaults are wrong for this use and are
# configured away rather than inherited; see openloops/store.py. Nothing here reaches
# the network, at import time or at run time.
dependencies = ["dol", "cw>=0.1.1,<0.2"]

[project.scripts]
ol = "openloops.__main__:main"

[project.urls]
Documentation = "https://thorwhalen.github.io/openloops/"
Homepage = "https://github.com/thorwhalen/openloops"
Repository = "https://github.com/thorwhalen/openloops"
Issues = "https://github.com/thorwhalen/openloops/issues"
Changelog = "https://github.com/thorwhalen/openloops/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]

# The agent-facing surface ships *inside* the package: `openloops/data/skills/` and
# `openloops/data/agents/` are markdown, not code, and a wheel is the only channel that
# reliably carries non-code data. Hatchling includes everything under `openloops/`
# implicitly today, so this section changes nothing about the current build — it states
# the fact, so that a later build target added here cannot silently drop the skills. A
# skill that is not in the wheel is not shipped, and nothing at runtime would say so;
# `tests/test_skills.py` builds a wheel and looks, which is the check that actually holds.
[tool.hatch.build.targets.wheel]
packages = ["openloops"]

# `only-include` is load-bearing, and the reason is not obvious enough to leave implicit.
#
# `.claude/skills/<name>` are DIRECTORY symlinks into `openloops/data/skills/` -- the
# bridge that makes the skills load for anyone working in this repo. Hatchling's
# `safe_walk` dedupes directories by (st_dev, st_ino) while following links, and
# `.claude` sorts before `openloops`: it reaches the real skill directories through the
# bridge first, records their inodes, and then PRUNES them when the walk arrives at them
# for real. The result is an sdist with no skills in it -- and since `uv build` (what CI
# runs) builds the wheel FROM the sdist, the published wheel has none either.
#
# `exclude` does not fix it: the sdist builder still descends `.claude` to filter it at
# yield time, so the inodes are still recorded. `only-include` routes through
# `recurse_explicit_files`, which never enters `.claude` at all.
#
# Measured 2026-08-27: without this, `unzip -l` on the release wheel shows the agent
# (a FILE symlink -- safe_walk only dedupes directories) and neither skill.
[tool.hatch.build.targets.sdist]
only-include = [
    "openloops",
    "tests",
    ".github",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "openloops"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.wads.ci]
project_name = "openloops"

[tool.wads.ci.testing]
python_versions = ["3.10", "3.12"]

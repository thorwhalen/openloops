<title>Phone Task Board</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Familjen+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column of task cards under a sticky filter bar; three views (Tasks, Runs, Phone kit) switched by hash. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --fg: #18202e; --muted: #5b6577; --line: #d9dee7;
  --accent: #2346b8; --accent-ink: #ffffff; --accent-soft: #e5ebfb;
  --tap: #1d7a4f; --browser: #2361b8; --session: #6b3fb0; --physical: #b0571d; --mac: #7a7f8a;
  --done: #1d7a4f; --warn: #a3610b; --warn-soft: #fbf0dc;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151c; --surface: #1a2029; --fg: #e6eaf1; --muted: #9aa4b5; --line: #2c3442;
  --accent: #8ea8ff; --accent-ink: #0d1530; --accent-soft: #222c47;
  --tap: #5cc794; --browser: #7aa7ff; --session: #b994f0; --physical: #f0a06a; --mac: #9aa0ab;
  --done: #5cc794; --warn: #f0b75a; --warn-soft: #3a2f1b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #1a2029; --fg: #e6eaf1; --muted: #9aa4b5; --line: #2c3442;
  --accent: #8ea8ff; --accent-ink: #0d1530; --accent-soft: #222c47;
  --tap: #5cc794; --browser: #7aa7ff; --session: #b994f0; --physical: #f0a06a; --mac: #9aa0ab;
  --done: #5cc794; --warn: #f0b75a; --warn-soft: #3a2f1b; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--f-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 720px; margin: 0 auto }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px 6px; border-bottom: 1px solid var(--line) }
h1 { font: 700 1.35rem/1.1 var(--f-display); margin: 0; letter-spacing: -.01em }
h2 { font: 700 1.15rem/1.2 var(--f-display); margin: 0; text-wrap: balance }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.navtoggle { font: 700 1.05rem var(--f-display); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; min-height: 40px; cursor: pointer; max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.navtoggle[aria-expanded="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
#navpanel { padding-top: 4px }
.tally { font: 400 .85rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
nav.views { display: flex; gap: 6px; margin-top: 10px }
nav.views a { flex: 1; text-align: center; padding: 10px 8px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 600; min-height: 44px }
nav.views a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px 2px; scrollbar-width: none }
.filters::-webkit-scrollbar { display: none }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 8px 12px; font: 600 .85rem var(--f-body); min-height: 38px; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.chip .n { font: 400 .75rem var(--f-mono); opacity: .75; margin-left: 4px }
.sep { flex: none; width: 1px; background: var(--line); margin: 4px 2px }
main { display: grid; gap: 12px; padding-top: 14px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0 }
.card.is-done { opacity: .55 }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 400 .8rem var(--f-mono); color: var(--muted) }
.tier { font: 700 .72rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 6px; color: var(--surface); background: var(--muted) }
.tier.tap { background: var(--tap) } .tier.browser { background: var(--browser) } .tier.session { background: var(--session) }
.tier.physical { background: var(--physical) } .tier.mac-only { background: var(--mac) }
.flag { font: 600 .72rem var(--f-mono); padding: 3px 8px; border-radius: 6px; background: var(--warn-soft); color: var(--warn) }
.flag.ok { background: var(--accent-soft); color: var(--done) }
.ask { font: 600 1.05rem/1.35 var(--f-body); margin: 0 }
.orig { color: var(--muted); font-size: .85rem; margin: 0; overflow-wrap: anywhere }
.note-src { color: var(--muted); font-size: .85rem; margin: 0 }
.decision { border-left: 3px solid var(--accent); padding: 4px 0 4px 10px; display: grid; gap: 4px; font-size: .92rem }
.decision ul { margin: 0; padding-left: 18px }
.decision .rec { font-weight: 700 }
pre.prompt { margin: 0; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font: 400 .8rem/1.45 var(--f-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9.5em; overflow: auto }
.links { display: flex; flex-wrap: wrap; gap: 6px }
.links a { font-size: .85rem; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere }
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px }
.btn { min-height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 700 .9rem var(--f-body); cursor: pointer; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; padding: 4px; touch-action: manipulation }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.good { color: var(--done); border-color: var(--done) }
.btn:focus-visible, .chip:focus-visible, nav.views a:focus-visible, .links a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.sub { display: flex; flex-wrap: wrap; gap: 6px }
.sub .btn { min-height: 40px; flex: 1; font-weight: 600; font-size: .82rem }
textarea { width: 100%; min-height: 64px; font: 400 .9rem var(--f-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 20; max-width: calc(100vw - 32px) }
.empty { color: var(--muted); padding: 24px 4px; text-align: center }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: .85rem; margin-top: 8px }
.run h2 { margin-bottom: 2px }
.run ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: .92rem }
.run .items { display: grid; gap: 6px }
.run .item { display: flex; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px; min-width: 0 }
.run .item > div { min-width: 0; overflow-wrap: anywhere; font-size: .9rem }
.run .item .btn { min-height: 40px; flex: none; padding: 4px 12px }
.kit h2 { margin-top: 6px }
summary { cursor: pointer; padding: 8px 0; min-height: 40px }
.kit p, .kit li { font-size: .95rem; max-width: 65ch }
.kit a { color: var(--accent) }
.kit .refs { font-size: .82rem; color: var(--muted) }
.small { font-size: .8rem; color: var(--muted) }
.sync { font: 600 .74rem var(--f-mono); margin-top: 4px; display: flex; gap: 8px; align-items: center; overflow-x: auto; white-space: nowrap; scrollbar-width: none }
.sync::-webkit-scrollbar { display: none }
.sync .ok { color: var(--done) } .sync .bad { color: var(--warn) } .sync .err { color: #c0362c }
.sync button { font: 600 .78rem var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 4px 8px; min-height: 32px }
.receipt { font: 600 .75rem var(--f-mono); padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); text-decoration: none }
.receipt.failed { background: var(--warn-soft); color: #c0362c }
.draft { font: 400 .75rem var(--f-mono); color: var(--muted) }
.btn.warn { color: var(--warn); border-color: var(--warn) }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.blocker { background: #c0362c; color: #fff; border-radius: 8px; padding: 10px 12px; font-weight: 700; margin-top: 8px }
.acted { outline: 2px solid var(--done); outline-offset: -2px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="wrap">
  <header class="bar">
    <div class="top">
      <button class="navtoggle" id="navtoggle" aria-expanded="false" aria-controls="navpanel"><span id="navlabel">Tasks</span> <span aria-hidden="true">▾</span></button>
      <span class="tally" id="tally">loading…</span>
    </div>
    <div class="sync" id="sync" role="status" aria-live="polite">Starting…</div>
    <div id="navpanel" hidden>
      <nav class="views">
        <a href="#tasks" id="v-tasks">Tasks</a><a href="#desk" id="v-desk">Decide</a><a href="#runs" id="v-runs">Runs</a><a href="#kit" id="v-kit">Phone kit</a>
      </nav>
      <div class="filters" id="filters" aria-label="Filters"></div>
    </div>
    <div id="banner" class="banner" hidden></div>
  </header>
  <main id="main"><p class="empty">Loading the task list…</p></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* Persistence model, schema 3 (read before changing anything):
   - Every action is an IMMUTABLE event, outbox/<eventId>. The page writes it once and never edits it. A retry
     re-sends the identical body, so retries are harmless.
   - The receiving Claude session (board.json `session`) writes its progress for each event into receipts/<eventId>. The page never
     writes receipts and the receiver never writes events.
   - A task's status (done, skipped, snoozed, answered) is DERIVED from its events. No overwritable status document.
   - Typed notes autosave to drafts/<key> (newest wins by `at`). They are posted only with a button press.
   - Before reaching the store, every write sits in this browser's journal (localStorage) and leaves it only after
     the store confirms. Without the store, the page blocks actions instead of pretending to save. */
const SCHEMA = 3;
const TIERS = ["tap", "browser", "session", "physical", "mac-only"];
const TIER_LABEL = { tap: "Tap", browser: "Browser", session: "Session", physical: "Physical", "mac-only": "Mac only" };
const TIMES = [{ k: "2", label: "≤ 2 min", max: 2 }, { k: "5", label: "≤ 5 min", max: 5 }, { k: "15", label: "≤ 15 min", max: 15 }];
const SHOWS = [{ k: "todo", label: "To do" }, { k: "maybe", label: "Maybe done" }, { k: "snoozed", label: "Snoozed" }, { k: "done", label: "Done" }, { k: "skipped", label: "Skipped" }];
/* Deployment settings come from board.json, written by `ol board build` next to this page. */
let SESSION = "the board session", READ_ONLY_ORGS = [], RUN_MACHINE = null, CONFIG_OK = false, MOVED_TO = null;
/* Fails closed: until board.json has loaded, every org counts as read-only, so no close button can appear for an org that should never be written to. */
const readOnly = org => !CONFIG_OK || READ_ONLY_ORGS.includes(String(org || "").toLowerCase());
const RETRY_MS = 15000, DRAFT_MS = 1000, MAX_INFLIGHT = 4, TAP_GUARD_MS = 400;
const RECEIPT = { processing: "Claude is on it", posted: "On GitHub", dispatched: "Sent to a worker", recorded: "Recorded", queued: "Queued, no worker yet", failed: "Failed", cancelled: "Cancelled by your undo" };
const FINAL = new Set(["posted", "dispatched", "recorded", "cancelled"]);

let TASKS = [], RUNS = [], KIT = "";
let server = { outbox: {}, receipts: {}, drafts: {}, questions: [], receiver: null, schema: null, loaded: false };
let db = null, dbState = "connecting", storageOk = true, needsRender = false, lastRender = 0, backoff = 0;
const inflight = new Set(), draftTimers = {}, acted = new Set(), armed = {};

/* ---------- browser journal ---------- */
function load(k, d) { try { const v = localStorage.getItem("ptb:" + k); return v == null ? d : JSON.parse(v) } catch { storageOk = false; return d } }
function save(k, v) { try { localStorage.setItem("ptb:" + k, JSON.stringify(v)); return true } catch { storageOk = false; return false } }
const ui = load("ui", { tiers: ["tap", "browser", "session", "physical"], orgs: [], time: null, show: "todo" });
let pending = load("pending3", {});   // path -> body, waiting for the store to confirm
let stuck = load("stuck3", {});       // path -> {body, code}: the store refused it for good
let drafts = load("drafts3", {});     // key -> {text, at}
function rid() { try { return crypto.randomUUID() } catch { return Date.now().toString(36) + Math.random().toString(36).slice(2) } }
const DEVICE = load("device", null) || (() => { const d = rid().slice(0, 8); save("device", d); return d })();
const docId = id => id.replace(/\//g, "~").replace(/#/g, "@").replace(/[^A-Za-z0-9_\-.~:@+]/g, "_");
const now = () => new Date().toISOString();
// Another tab of this browser changed the journal: merge rather than overwrite.
addEventListener("storage", e => {
  if (e.key === "ptb:pending3") { pending = { ...load("pending3", {}), ...pending }; flush() }
  if (e.key === "ptb:drafts3") { const other = load("drafts3", {}); for (const [k, v] of Object.entries(other)) if (!drafts[k] || v.at > drafts[k].at) drafts[k] = v; render() }
});
function savePending() { const disk = load("pending3", {}); for (const p of Object.keys(disk)) if (!(p in pending) && !confirmed.has(p)) pending[p] = disk[p]; return save("pending3", pending) }
const confirmed = new Set();

/* ---------- the store seam ----------
   The page needs two calls from a store: doc(path).set(body) -> Promise, and
   collection(name).onSnapshot(onNext, onError). The default is the claude.ai Artifact
   `db` capability. board.json `store: {kind: "http", api, poll_ms}` swaps in httpStore,
   which speaks the openloops board store API (openloops.board_store) on the same
   origin, with the viewer's own login cookie. Error codes map onto the db ones, so the
   code below cannot tell the two apart. */
let SIGNED_OUT = false;
const sleepers = new Set();
document.addEventListener("visibilitychange", () => { if (!document.hidden) { const due = [...sleepers]; sleepers.clear(); due.forEach(f => f()) } });
function httpStore(api, { pollMs = 5000 } = {}) {
  const base = String(api).replace(/\/+$/, "");
  const CODES = { 400: "invalid_argument", 409: "invalid_argument", 412: "invalid_argument", 413: "quota_exceeded", 401: "not_granted", 403: "not_granted" };
  const fail = r => { if (r.status === 401) SIGNED_OUT = true; const e = new Error("store said " + r.status); e.code = CODES[r.status] || "unavailable"; throw e };
  const call = (path, init = {}) => fetch(base + "/" + path.split("/").map(encodeURIComponent).join("/"),
    { credentials: "same-origin", cache: "no-store", ...init, headers: { "Content-Type": "application/json", ...(init.headers || {}) } })
    .then(r => r.status === 304 ? null : r.ok ? r.json().then(j => (j.__etag = r.headers.get("ETag"), j)) : fail(r), () => fail({ status: 0 }));
  return {
    doc: path => ({ set: body => call(path, { method: "PUT", body: JSON.stringify(body) }) }),
    collection: name => ({
      onSnapshot(onNext, onError) {
        let stopped = false, timer = null, etag = null;
        // A poll that changed nothing costs a 304 and no render: the listing's ETag is sent back.
        const tick = () => stopped ? null : call(name, etag ? { headers: { "If-None-Match": etag } } : {}).then(j => {
          if (stopped) return;
          if (j) { etag = j.__etag || null; onNext({ docs: (j.docs || []).map(d => ({ id: d.id, data: () => d.data })), metadata: { fromCache: false } }) }
          // A hidden tab stops polling; visibilitychange below wakes it.
          timer = document.hidden ? null : setTimeout(tick, pollMs);
          if (!timer) sleepers.add(tick);
        }, e => { if (!stopped) { stopped = true; onError(e) } });
        tick();
        return () => { stopped = true; clearTimeout(timer) };
      }
    })
  };
}

/* ---------- writes ---------- */
/* A board that moved (board.json `moved_to`) still flushes what this phone already queued, but takes no new taps. */
function canWrite() { return !MOVED_TO && !!db && server.loaded && !(server.schema && server.schema > SCHEMA) }
function put(path, body) { pending[path] = body; savePending(); flush() }
function flush() {
  syncLine();
  if (!db) return;
  for (const path of Object.keys(pending)) {
    if (inflight.size >= MAX_INFLIGHT) break;
    if (inflight.has(path)) continue;
    const body = pending[path];
    inflight.add(path);
    db.doc(path).set(body).then(() => {
      if (pending[path] === body) { delete pending[path]; confirmed.add(path); savePending() }
      backoff = 0;
    }).catch(e => {
      const code = e?.code || "unavailable";
      if (code === "invalid_argument" || code === "quota_exceeded" || code === "transform_error") { stuck[path] = { body, code }; delete pending[path]; save("stuck3", stuck); savePending() }
      else if (code === "revoked" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") { db = null; dbState = "lost" }
      else backoff = Math.min(6, backoff + 1);
    }).finally(() => { inflight.delete(path); syncLine(); if (Object.keys(pending).length) setTimeout(flush, backoff ? 1000 * 2 ** backoff : 50) });
  }
}
setInterval(flush, RETRY_MS);
addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") flush() });

function newEvent(t, kind, extra = {}) {
  const id = now().replace(/[-:.TZ]/g, "") + "-" + DEVICE + "-" + rid().slice(0, 6);
  const body = { id, schema: SCHEMA, task_id: t.id, url: t.url || null, kind: t.kind || "issue", org: t.org || null, action: kind, ...extra, createdAt: now(), device: DEVICE };
  put("outbox/" + id, body);
  return body;
}

/* ---------- derived state ---------- */
function allEvents() {
  const m = { ...server.outbox };
  for (const [p, e] of Object.entries(pending)) if (p.startsWith("outbox/")) m[e.id] = { ...e, _local: true };
  for (const [p, s] of Object.entries(stuck)) if (p.startsWith("outbox/")) m[s.body.id] = { ...s.body, _stuck: s.code };
  return m;
}
let evCache = null;
function eventsByTask() {
  if (evCache) return evCache;
  const by = {};
  for (const e of Object.values(allEvents()).sort((a, b) => a.id < b.id ? -1 : 1)) (by[e.task_id] ||= []).push(e);
  return evCache = by;
}
function derived(taskId) {
  const evs = eventsByTask()[taskId] || [];
  const undone = new Set(evs.filter(e => e.action === "undo" && e.undoes).map(e => e.undoes));
  let st = { status: "todo" };
  for (const e of evs) {
    if (undone.has(e.id) || e.action === "undo" || e.action === "note") continue;
    if (e.action === "done" || e.action === "done_close") st = { status: "done", ev: e };
    else if (e.action === "skip") st = { status: "skipped", ev: e };
    else if (e.action === "snooze") st = { status: "snoozed", until: e.until, ev: e };
    else if (e.action === "answer") st = { status: "done", answered: e.answer, ev: e };
    else if (e.action === "run") st = { status: "done", ran: true, ev: e };
  }
  return st;
}
function stOf(t) {
  const d = derived(t.id);
  if (d.status === "snoozed" && !(d.until && new Date(d.until) > new Date())) return t.status && t.status !== "open" ? "maybe" : "todo";
  if (d.status !== "todo") return d.status;
  return t.status && t.status !== "open" ? "maybe" : "todo";
}
function lastSentNote(taskId) { const evs = (eventsByTask()[taskId] || []).filter(e => e.note); return evs.length ? evs[evs.length - 1].note : null }

/* ---------- drafts ---------- */
function draftOf(key) {
  const loc = drafts[key], srv = server.drafts[key];
  const d = !srv || (loc && loc.at >= srv.at) ? loc : srv;
  return d?.text || "";
}
function setDraft(key, text, store) {
  drafts[key] = { text, at: now() }; save("drafts3", drafts);
  clearTimeout(draftTimers[key]);
  if (store) storeDraft(key); else draftTimers[key] = setTimeout(() => storeDraft(key), DRAFT_MS);
}
function storeDraft(key) { clearTimeout(draftTimers[key]); delete draftTimers[key]; if (drafts[key] && !MOVED_TO) put("drafts/" + key, { key, ...drafts[key], device: DEVICE }) }
addEventListener("pagehide", () => { for (const k of Object.keys(draftTimers)) storeDraft(k); save("drafts3", drafts); save("pending3", pending) });
function noteFor(key) { const ta = document.getElementById("note-" + key); return (ta ? ta.value : draftOf(key)).trim() }

/* ---------- actions ---------- */
function guard() { return Date.now() - lastRender < TAP_GUARD_MS }
function act(t, action, extra = {}, key = docId(t.id)) {
  if (guard()) { toast("Tap again: the list just changed under your finger"); return }
  if (!canWrite()) { toast("Not saved: this view cannot reach the board's store. Reload, or open the board in a browser."); return }
  document.activeElement?.blur?.();
  const note = noteFor(key);
  if (note) extra.note = note;
  if (action === "note" && !note) { toast("Type a note first"); return }
  newEvent(t, action, extra);
  if (note) setDraft(key, "", true);
  acted.add(t.id); evCache = null;
  toast(action === "note" ? "Note saved. Claude posts it within a few minutes." : "Saved. Claude acts on it within a few minutes.");
  render();
}
function undo(t) { const d = derived(t.id); if (d.ev) act(t, "undo", { undoes: d.ev.id, undoes_action: d.ev.action }) }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600) }
async function copy(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done) }
  catch { const ta = el("textarea", { readonly: true, style: "position:fixed;inset:auto 16px 80px 16px;z-index:30;height:40vh" }); ta.value = text; document.body.append(ta); ta.focus(); ta.select(); toast("Select and copy the text"); setTimeout(() => ta.remove(), 15000) }
}
function age(d) {
  if (!d) return null;
  const h = (Date.now() - new Date(d)) / 3600e3;
  return h < 24 ? "today" : h < 24 * 14 ? Math.floor(h / 24) + "d" : h < 24 * 61 ? Math.round(h / 168) + "w" : Math.round(h / 730) + "mo";
}

function syncLine() {
  const n = Object.keys(pending).length, nStuck = Object.keys(stuck).length, typing = Object.keys(draftTimers).length;
  const unsent = Object.entries(drafts).filter(([, d]) => d.text?.trim()).length;
  const s = $("#sync"); s.replaceChildren();
  const b = $("#banner"); b.hidden = true; b.className = "banner";
  if (MOVED_TO) { b.hidden = false; b.className = "blocker"; b.replaceChildren("This board has moved. Nothing you tap here is saved any more: ", el("a", { href: MOVED_TO, rel: "noopener" }, "open the new board")) }
  else if (!db && SIGNED_OUT) { b.hidden = false; b.className = "blocker"; b.textContent = "You are signed out, so the buttons are off. Reload the page to sign in again; your unsaved taps are kept on this phone." }
  else if (!db && dbState !== "connecting") { b.hidden = false; b.className = "blocker"; b.textContent = "This view cannot save to the board. Your taps would stay on this phone only, so the buttons are off. Reload the page; if this stays, open the board in your phone's browser." }
  else if (server.schema && server.schema > SCHEMA) { b.hidden = false; b.className = "blocker"; b.textContent = "A newer version of this board is out. Reload the page before tapping anything." }
  if (!storageOk) s.append(el("span", { class: "err" }, "This browser blocks local storage."));
  if (dbState === "connecting") s.append(el("span", { class: "bad" }, "Connecting…"));
  else if (n || typing) s.append(el("span", { class: "bad" }, `Saving ${n + typing}…`));
  else if (db) s.append(el("span", { class: "ok" }, "All saved ✓"));
  if (nStuck) s.append(el("span", { class: "err" }, `${nStuck} refused by the store`));
  if (unsent) s.append(el("span", { class: "draft" }, `${unsent} unsent note${unsent > 1 ? "s" : ""}`));
  const r = server.receiver;
  if (r?.at) { const mins = Math.round((Date.now() - new Date(r.at)) / 60000); s.append(el("span", { class: mins > 20 ? "bad" : "draft" }, `Claude checked ${mins < 1 ? "just now" : mins + " min ago"}`)) }
  if (nStuck || (n && !db)) s.append(el("button", { onclick: () => copy(`${SESSION}: the board could not save these; apply them: ${JSON.stringify({ pending, stuck })}`, "Copied: paste it into the session") }, "Copy unsaved"));
}

function receipt(taskId) {
  const evs = (eventsByTask()[taskId] || []);
  if (!evs.length) return null;
  // Show the worst unfinished event; if all are finished, the newest one.
  let show = null;
  for (const e of evs) {
    const r = server.receipts[e.id];
    const st = e._stuck ? "stuck" : e._local ? "local" : !r ? "waiting" : r.status;
    if (!FINAL.has(st)) { show = { e, r, st }; if (st === "failed" || st === "stuck") break }
  }
  if (!show) { const e = evs[evs.length - 1]; show = { e, r: server.receipts[e.id], st: server.receipts[e.id]?.status } }
  const { r, st } = show;
  const label = st === "stuck" ? "Refused by the store" : st === "local" ? "Saving…" : st === "waiting" ? "Saved · waiting for Claude"
    : (RECEIPT[st] || st) + (st === "dispatched" && r?.result?.worker ? ": " + r.result.worker : "") + (st === "failed" && r?.result?.error ? ": " + r.result.error : "");
  const href = r?.result?.comment_url;
  const bad = st === "failed" || st === "stuck";
  return href ? el("a", { class: "receipt", href, target: "_blank", rel: "noopener" }, label + " ↗") : el("span", { class: "receipt" + (bad ? " failed" : "") }, label);
}
function score(t) { return TIERS.indexOf(t.tier) * 10000 + (t.minutes || 10) * 10 / (1 + (t.unblocks?.length || 0)) }

/* ---------- views ---------- */
function filtersBar() {
  const f = $("#filters"); f.replaceChildren();
  const count = k => TASKS.filter(t => stOf(t) === k).length;
  const chip = (label, on, fn, n) => el("button", { class: "chip", "aria-pressed": String(on), onclick: () => { fn(); acted.clear(); save("ui", ui); render() } }, label, n != null ? el("span", { class: "n" }, n) : null);
  for (const s of SHOWS) f.append(chip(s.label, ui.show === s.k, () => ui.show = s.k, count(s.k)));
  f.append(el("span", { class: "sep" }));
  for (const tier of TIERS) f.append(chip(TIER_LABEL[tier], ui.tiers.includes(tier), () => ui.tiers = ui.tiers.includes(tier) ? ui.tiers.filter(x => x !== tier) : [...ui.tiers, tier]));
  f.append(el("span", { class: "sep" }));
  for (const tm of TIMES) f.append(chip(tm.label, ui.time === tm.k, () => ui.time = ui.time === tm.k ? null : tm.k));
  f.append(el("span", { class: "sep" }));
  for (const o of [...new Set(TASKS.map(t => t.org))].sort()) f.append(chip(o, ui.orgs.includes(o), () => ui.orgs = ui.orgs.includes(o) ? ui.orgs.filter(x => x !== o) : [...ui.orgs, o]));
}

function noteBox(key, taskId, label) {
  const ta = el("textarea", { id: "note-" + key, placeholder: "Your answer or note. Saved as you type; posted to GitHub only when you press a button.", "aria-label": label });
  ta.value = draftOf(key);
  const status = el("div", { class: "draft" });
  const sent = lastSentNote(taskId);
  status.textContent = ta.value.trim() ? "Draft, saved, not posted yet" : sent ? "Last note sent: " + sent.slice(0, 80) : "";
  ta.addEventListener("input", () => { if (!ta.isConnected) return; setDraft(key, ta.value, false); status.textContent = "Draft, saved, not posted yet"; syncLine() });
  ta.addEventListener("blur", () => { if (draftTimers[key]) storeDraft(key); if (needsRender) setTimeout(render, 0) });
  return [ta, status];
}

function card(t) {
  const st = stOf(t), d = derived(t.id), key = docId(t.id), w = canWrite();
  const open = t.links?.[0]?.url || t.url;
  const isIssue = t.kind === "issue", readOnlyOrg = readOnly(t.org);
  const kids = [
    el("div", { class: "meta" },
      el("span", { class: "tier " + t.tier }, TIER_LABEL[t.tier] || t.tier), el("span", {}, `${t.minutes ?? "?"} min`), el("span", {}, t.id),
      t.created ? el("span", { title: "opened " + t.created }, "opened " + (age(t.created) === "today" ? "today" : age(t.created) + " ago")) : null,
      t.unblocks?.length ? el("span", { class: "flag ok" }, `unblocks ${t.unblocks.length}`) : null,
      t.status && t.status !== "open" ? el("span", { class: "flag" }, t.status) : null,
      st === "snoozed" ? el("span", { class: "flag" }, "until " + (d.until || "").slice(0, 10)) : null,
      d.answered ? el("span", { class: "flag ok" }, "answered: " + d.answered.slice(0, 40)) : null,
      receipt(t.id)),
    el("p", { class: "ask" }, t.ask), el("p", { class: "orig" }, t.title)];
  if (t.note) kids.push(el("p", { class: "note-src" }, t.note));
  if (t.decision) kids.push(el("div", { class: "decision" },
    t.decision.question ? el("div", {}, t.decision.question) : null,
    t.decision.options?.length ? el("ul", {}, t.decision.options.map(o => el("li", {}, o))) : null,
    el("div", { class: "rec" }, t.decision.recommendation ? "Recommended: " + t.decision.recommendation : "No recommendation in the issue")));
  if (t.prompt) kids.push(el("pre", { class: "prompt" }, t.prompt), el("div", { class: "sub" },
    el("button", { class: "btn primary", disabled: !w || d.ran, onclick: () => act(t, "run", { prompt: t.prompt, machine: t.machine || null }) }, d.ran ? "Agent asked" : "Have an agent do it"),
    el("button", { class: "btn", onclick: () => copy(t.prompt, "Prompt copied") }, "Copy prompt")));
  if (t.unblocks?.length) kids.push(el("p", { class: "small" }, "Unblocks: " + t.unblocks.join(" · ")));
  if (t.links?.length > 1) kids.push(el("div", { class: "links" }, t.links.slice(1).map(l => el("a", { href: l.url, target: "_blank", rel: "noopener" }, l.label))));
  kids.push(...noteBox(key, t.id, "Note for " + t.id));
  const isOn = st === "done" || st === "skipped" || st === "snoozed";
  kids.push(el("div", { class: "actions" },
    open ? el("a", { class: "btn primary", href: open, target: "_blank", rel: "noopener" }, "Open") : el("span", { class: "btn" }, "No link"),
    el("button", { class: "btn good", disabled: !w, onclick: () => st === "done" ? undo(t) : act(t, "done") }, st === "done" ? "Undo" : "Done"),
    el("button", { class: "btn", disabled: !w, onclick: () => st === "skipped" ? undo(t) : act(t, "skip") }, st === "skipped" ? "Unskip" : "Skip"),
    el("button", { class: "btn", onclick: () => copy(`${SESSION}: tell me about ${t.id}: what it asks, the trade-offs, and your recommendation.`, "Question copied: paste it into the session") }, "Ask")));
  kids.push(el("div", { class: "sub" },
    el("button", { class: "btn", disabled: !w, onclick: () => act(t, "note") }, "Post note only"),
    isIssue && !readOnlyOrg && !isOn ? el("button", { class: "btn warn", disabled: !w, onclick: () => act(t, "done_close") }, "Done & close issue") : null,
    st === "snoozed" ? el("button", { class: "btn", disabled: !w, onclick: () => undo(t) }, "Unsnooze") : null,
    !isOn ? el("button", { class: "btn", disabled: !w, onclick: () => act(t, "snooze", { until: new Date(Date.now() + 86400e3).toISOString() }) }, "Snooze 1 day") : null,
    !isOn ? el("button", { class: "btn", disabled: !w, onclick: () => act(t, "snooze", { until: new Date(Date.now() + 7 * 86400e3).toISOString() }) }, "Snooze 1 week") : null));
  if (readOnlyOrg) kids.push(el("p", { class: "small" }, CONFIG_OK ? t.org + ": Claude never comments there. Your choices are recorded on the board only." : "Board settings did not load, so closing is off. Reload the page."));
  return el("article", { class: "card" + (st === "done" ? " is-done" : "") + (acted.has(t.id) ? " acted" : "") }, kids);
}

function viewTasks(m) {
  const tm = TIMES.find(x => x.k === ui.time);
  const list = TASKS.filter(t => (stOf(t) === ui.show || acted.has(t.id)) && ui.tiers.includes(t.tier) && (!ui.orgs.length || ui.orgs.includes(t.org)) && (!tm || (t.minutes ?? 99) <= tm.max)).sort((a, b) => score(a) - score(b));
  m.replaceChildren(...(list.length ? list.map(card) : [el("p", { class: "empty" }, "Nothing matches these filters. Tap a tier or a status above to widen them.")]));
}

function viewDesk(m) {
  const w = canWrite();
  const qs = server.questions.map(q => ({ ...q, answer: derived(q.task_id).answered }));
  const open = qs.filter(q => !q.answer || acted.has(q.task_id)).sort((a, b) => (b.impact || 0) - (a.impact || 0));
  const done = qs.filter(q => q.answer && !acted.has(q.task_id));
  const head = el("section", { class: "card" }, el("h2", {}, "Decision desk"),
    el("p", { class: "small" }, `Tap an answer. It is saved at once (see the line under the title), then Claude posts it on the issue and hands the follow-up to a worker. ${qs.filter(q => !q.answer).length} waiting, ${qs.filter(q => q.answer).length} answered.`));
  const qcard = q => {
    const t = TASKS.find(x => x.id === q.task_id) || { id: q.task_id, url: q.url, kind: "issue", org: q.org };
    const key = "q-" + q._id;
    const pick = o => { if (o === q.answer) return; act(t, "answer", { answer: o, question: q.question, recommendation: q.context || null }, key) };
    return el("article", { class: "card" + (acted.has(q.task_id) ? " acted" : "") },
      el("div", { class: "meta" }, el("span", { class: "tier tap" }, "Answer"), el("span", {}, q.task_id), q.impact ? el("span", { class: "flag ok" }, `unblocks ${q.impact}`) : null, receipt(q.task_id)),
      el("p", { class: "ask" }, q.question), q.context ? el("p", { class: "note-src" }, q.context) : null,
      q.url ? el("div", { class: "links" }, el("a", { href: q.url, target: "_blank", rel: "noopener" }, "Read the issue")) : null,
      ...noteBox(key, q.task_id, "Note with your answer"),
      el("div", { style: "display:grid;gap:6px" }, [...(q.options || []), "You decide"].map(o =>
        el("button", { class: "btn" + (q.answer === o ? " primary" : o === q.recommended ? " good" : ""), disabled: !w, onclick: () => pick(o) }, (o === q.recommended ? "★ " : "") + o))),
      q.answer ? el("p", { class: "small" }, "Your answer: " + q.answer + ". Tap another to change it.") : null);
  };
  m.replaceChildren(head, ...open.map(qcard), ...(done.length ? [el("h2", {}, "Answered")] : []), ...done.map(qcard));
}

function viewRuns(m) {
  const w = canWrite(), kids = [];
  for (const r of RUNS) {
    const items = r.ids.map(id => TASKS.find(t => t.id === id)).filter(Boolean);
    const left = items.filter(t => !["done", "skipped"].includes(stOf(t))).length;
    const started = Object.values(allEvents()).some(e => e.action === "run" && e.run === r.key);
    let bulk = null;
    if (r.key === "cleanup") {
      const targets = items.filter(t => t.kind === "issue" && !readOnly(t.org) && stOf(t) === "maybe");
      const isArmed = armed.cleanup && Date.now() - armed.cleanup < 6000;
      bulk = el("div", { class: "sub" }, el("button", { class: "btn warn", disabled: !w || !targets.length,
        onclick: () => {
          if (!isArmed) { armed.cleanup = Date.now(); render(); setTimeout(render, 6100); return }
          armed.cleanup = 0;
          for (const t of targets) newEvent(t, "done_close", { reason: "clean-up run: looked done or obsolete" });
          evCache = null; toast(`Saved: Claude will close ${targets.length} issues`); render();
        } }, !targets.length ? "Nothing left to close" : isArmed ? `Tap again to close ${targets.length} issues` : `Close the ${targets.length} not kept`));
    }
    kids.push(el("section", { class: "card run" },
      el("div", { class: "meta" }, el("span", { class: "tier " + r.tier }, TIER_LABEL[r.tier]), el("span", {}, `${left} of ${items.length} left`), el("span", {}, `≈ ${r.minutes_each} min each`)),
      el("h2", {}, r.title), r.why ? el("p", { class: "small" }, r.why) : null,
      r.steps?.length ? el("ol", {}, r.steps.map(s => el("li", {}, s))) : null,
      r.prompt ? el("pre", { class: "prompt" }, r.prompt) : null,
      r.prompt ? el("div", { class: "sub" },
        el("button", { class: "btn primary", disabled: !w || started, onclick: () => { if (guard() || started) return; newEvent({ id: "run:" + r.key, kind: "run", org: null }, "run", { prompt: r.prompt, machine: r.machine || RUN_MACHINE, run: r.key, task_ids: r.ids }); evCache = null; toast("Saved. Claude starts this run within a few minutes."); render() } }, started ? "Run requested" : "Have an agent start this run"),
        el("button", { class: "btn", onclick: () => copy(r.prompt, "Prompt copied") }, "Copy prompt")) : null,
      bulk,
      el("div", { class: "items" }, items.map(t => {
        const st = stOf(t);
        return el("div", { class: "item" },
          el("div", {}, el("a", { href: t.links?.[0]?.url || t.url, target: "_blank", rel: "noopener" }, t.pattern_key || t.id), el("div", { class: "small" }, t.id + (st !== "todo" ? " · " + st : "")), receipt(t.id)),
          el("div", { class: "sub", style: "flex:none" },
            el("button", { class: "btn good", disabled: !w, onclick: () => st === "done" ? undo(t) : act(t, "done") }, st === "done" ? "Undo" : "Done"),
            r.key === "cleanup" ? el("button", { class: "btn", disabled: !w, onclick: () => st === "skipped" ? undo(t) : act(t, "skip", { reason: "keep open" }) }, st === "skipped" ? "Kept ✓" : "Keep") : null));
      })),
      r.packages?.length ? el("details", {}, el("summary", { class: "small" }, `Per-package settings links (${r.packages.length})`),
        el("div", { class: "items" }, r.packages.map(p => el("div", { class: "item" }, el("div", {}, el("a", { href: p.url, target: "_blank", rel: "noopener" }, p.pkg),
          el("div", { class: "small" }, `${p.repo} · ${p.workflow}${p.env ? " · env " + p.env : ""}${p.first_publish ? " · first publish" : ""}`)))))) : null));
  }
  m.replaceChildren(...(kids.length ? kids : [el("p", { class: "empty" }, "No repeated patterns.")]));
}

function viewKit(m) { const d = el("section", { class: "card kit" }); d.innerHTML = KIT; m.replaceChildren(d) }

function render() {
  evCache = null;
  if (document.activeElement?.tagName === "TEXTAREA" && $("#main").contains(document.activeElement)) { needsRender = true; syncLine(); return }
  needsRender = false; lastRender = Date.now();
  const v = (location.hash || "#tasks").slice(1);
  for (const k of ["tasks", "desk", "runs", "kit"]) $("#v-" + k).setAttribute("aria-current", k === v ? "page" : "false");
  $("#filters").hidden = v !== "tasks";
  const VIEW = { tasks: "Tasks", desk: "Decide", runs: "Runs", kit: "Phone kit" }[v] || "Tasks";
  const nf = (ui.tiers.length !== 4 ? 1 : 0) + ui.orgs.length + (ui.time ? 1 : 0);
  $("#navlabel").textContent = v === "tasks" ? `${VIEW} · ${SHOWS.find(x => x.k === ui.show)?.label || ""}${nf ? ` · ${nf} filter${nf > 1 ? "s" : ""}` : ""}` : VIEW;
  $("#tally").textContent = `${TASKS.filter(t => stOf(t) === "todo").length} to do · ${TASKS.filter(t => stOf(t) === "done").length} done`;
  syncLine(); filtersBar();
  const m = $("#main");
  if (v === "runs") viewRuns(m); else if (v === "desk") viewDesk(m); else if (v === "kit") viewKit(m); else viewTasks(m);
}
function setNav(open) { $("#navpanel").hidden = !open; $("#navtoggle").setAttribute("aria-expanded", String(open)); save("navopen", open) }
$("#navtoggle").addEventListener("click", () => setNav($("#navpanel").hidden));
setNav(load("navopen", false) === true);
addEventListener("hashchange", () => { setNav(false); needsRender = false; acted.clear(); document.activeElement?.blur?.(); render() });

/* ---------- live subscriptions, re-opened with backoff if they die ---------- */
const byId = docs => Object.fromEntries(docs.map(d => [d.id, d.data()]));
const seen = new Set();
function subscribe(path, onDocs, attempt = 0) {
  db.collection(path).onSnapshot(snap => {
    attempt = 0; onDocs(snap.docs);
    if (!snap.metadata.fromCache) seen.add(path);
    if (!server.loaded && ["outbox", "drafts", "meta"].every(p => seen.has(p))) { server.loaded = true; flush() }
    render();
  }, e => {
    if (["revoked", "not_granted", "capability_disabled", "capability_removed"].includes(e?.code)) { db = null; dbState = "lost"; render(); return }
    setTimeout(() => db && subscribe(path, onDocs, attempt + 1), Math.min(60000, 2000 * 2 ** attempt));
  });
}

async function boot() {
  let c = null;
  try {
    const [t, r, k, c_] = await Promise.all([fetch("tasks.json").then(x => x.json()), fetch("runs.json").then(x => x.json()), fetch("kit.html").then(x => x.text()), fetch("board.json").then(x => x.ok ? x.json() : null).catch(() => null)]);
    c = c_;
    TASKS = t.filter(x => x.status !== "not-for-user"); RUNS = r; KIT = k;
    if (c && Array.isArray(c.read_only_orgs)) {
      CONFIG_OK = true;
      READ_ONLY_ORGS = c.read_only_orgs.map(o => String(o).toLowerCase());
      if (c.session) SESSION = c.session;
      if (c.machine) RUN_MACHINE = c.machine;
      if (c.title) document.title = c.title
    }
    if (c && /^https:\/\//.test(c.moved_to || "")) MOVED_TO = c.moved_to;
  } catch { $("#main").replaceChildren(el("p", { class: "empty" }, "The task list did not load. Reload the page.")) }
  render();
  const store = c?.store;
  if (store?.kind === "http" && store.api) db = httpStore(store.api, { pollMs: store.poll_ms || undefined });
  else db = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
  dbState = db ? "ok" : "lost";
  render();
  if (!db) return;
  // Events are immutable, so writing before a server-confirmed snapshot cannot clobber anything; this only guards against a viewer that never confirms.
  setTimeout(() => { if (!server.loaded && db) { server.loaded = true; render(); flush() } }, 8000);
  subscribe("outbox", docs => server.outbox = byId(docs));
  subscribe("receipts", docs => server.receipts = byId(docs));
  subscribe("drafts", docs => { server.drafts = byId(docs); for (const [k, v] of Object.entries(server.drafts)) if (drafts[k] && v.at > drafts[k].at) { drafts[k] = { text: v.text, at: v.at }; save("drafts3", drafts) } });
  subscribe("meta", docs => { const m = byId(docs); server.receiver = m.receiver || null; server.schema = m.schema?.version || null });
  subscribe("questions", docs => server.questions = docs.flatMap(d => Object.entries(d.data().items || {}).map(([id, q]) => ({ ...q, _id: id }))));
}
boot();
</script>

# The `ol` alias distribution: metadata and nothing else.
#
# ADR-004 settled that `openloops` is the name of the project, the repository, the
# distribution and the import package, and that the console script is `ol`. That split
# is deliberate and this does not undo it. It only closes the one gap the split leaves:
# a reader who has seen the command has no way to guess that the install line says
# something else. So `ol` is registered, points home, and ships no code -- the `ol`
# executable still comes from `openloops`'s own [project.scripts], never from here.
#
# Declaring a script of our own would be the one way to get this wrong: two
# distributions writing the same file into bin/ is a silent, PATH-ordered coin flip.
# There is exactly one `ol` entry point in the world and it belongs to the parent.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ol"
version = "0.1.0"
description = "Alias for openloops: installs it, which is what puts the `ol` command on your PATH. No code of its own."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["openloops", "alias", "claude-code", "agents", "open-loops"]
authors = [{ name = "Thor Whalen" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]

# A floor, not a pin, and the choice is not stylistic. A pin (`openloops==0.1.6`) would
# make this alias a standing tax on the parent's release cadence -- every openloops
# release would need an `ol` release to chase it -- and the day one is forgotten,
# `pip install ol` starts *holding users back*, or fails to resolve at all next to an
# already-installed newer openloops. The usual reason to pin is a compatibility surface
# to protect, and this distribution has none: zero imports, zero code, one promise.
# The floor is the release this alias was built and verified against; it rises only if
# the promise ("installing this puts `ol` on PATH") ever needs a newer parent to hold.
dependencies = ["openloops>=0.1.6"]

[project.urls]
Documentation = "https://thorwhalen.github.io/openloops/"
Homepage = "https://github.com/thorwhalen/openloops"
Repository = "https://github.com/thorwhalen/openloops"
Issues = "https://github.com/thorwhalen/openloops/issues"
Changelog = "https://github.com/thorwhalen/openloops/blob/main/CHANGELOG.md"
"Real package" = "https://pypi.org/project/openloops/"

# There is no Python package to find, so hatchling must be told not to look. Without
# this it fails the build rather than shipping an empty wheel, which is the right
# default everywhere except here.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["README.md", "pyproject.toml"]
